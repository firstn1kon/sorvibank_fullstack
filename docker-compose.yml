services:
  postgres:
    image: postgres:16-alpine
    container_name: sorvibank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sorvibank
      POSTGRES_PASSWORD: sorvibank
      POSTGRES_DB: sorvibank
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sorvibank']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
